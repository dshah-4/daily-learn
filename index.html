<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Learn</title>
  <meta name="description" content="Six small lessons and a quiz, every day.">
  <meta name="theme-color" content="#0e0e12">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Learn">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Daily<span>Learn</span></div>
      <div class="streak" id="streak" title="Current streak">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1 3 2 3.5C11 9 10.5 5.5 12 2z"/></svg>
        <span id="streak-count">0</span>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" aria-label="Sections">
      <button class="tab active" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
        <span>Today</span>
      </button>
      <button class="tab" data-tab="archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>
        <span>Archive</span>
      </button>
      <button class="tab" data-tab="saved">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
        <span>Saved</span>
      </button>
    </nav>
  </div>

  <!-- Full-screen lesson player (cards + quiz) -->
  <section id="player" class="player" hidden>
    <div class="player-top">
      <div class="segments" id="segments"></div>
      <div class="player-bar">
        <span class="player-date" id="player-date"></span>
        <div class="player-actions">
          <button class="icon-btn" id="bookmark-btn" aria-label="Save card">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>
          </button>
          <button class="icon-btn" id="close-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
